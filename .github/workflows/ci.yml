name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web UI and CLI
        run: pnpm build
      - name: CLI smoke
        run: node apps/cli/dist/landed.mjs --version
      - name: Migrations match schema
        run: pnpm --filter @landed/db db:check
